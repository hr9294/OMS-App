# ===================================================================
# OMS / UFT FAST Mobile App Automation - Local Properties Configuration
# ===================================================================

# Appium Server URL
appium.server.url=http://127.0.0.1:4723

# Android Device / Capabilities
platform.name=Android
automation.name=UiAutomator2
device.name=Android Device

# Application Package & Launch Activity (UFT FAST OMS App)
app.package=com.uftcl.uftfast.staging
app.activity=com.uftcl.uftfast.MainActivity

# Optional: Path to local APK file if you want Appium to auto-install
# app.path=D:/Apks/UFT_FAST.apk

# Default Login Test Credentials (From Mobile App Screenshot)
user.code=53196
user.password=12345

# Explicit Wait Timeout in Seconds
timeout.seconds=20

# Test Target Stocks
test.symbol=ABBANK
test.watchlist.exchange=DSE
test.order.qty=10
test.order.rate=32.5
